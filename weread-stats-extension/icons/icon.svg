<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 微信读书统计助手 · 线性开卷书
       深色底 #0f172a · 渐变 #0188FC to #26B5FE (135deg) · 与 css/style.css 主题一致 -->
  <defs>
    <linearGradient
      id="accent-grad"
      gradientUnits="userSpaceOnUse"
      x1="111"
      y1="125"
      x2="401"
      y2="390"
    >
      <stop offset="0" stop-color="#0188FC" />
      <stop offset="1" stop-color="#26B5FE" />
    </linearGradient>
  </defs>

  <!-- 圆角方形底（rx ≈ 22.5%） -->
  <rect width="512" height="512" rx="115" fill="#0f172a" />

  <!-- 线性开卷书（与应用内 brand-logo 同款 24 网格造型，居中放大） -->
  <g
    transform="translate(82 82) scale(14.5)"
    fill="none"
    stroke="url(#accent-grad)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
  </g>
</svg>
